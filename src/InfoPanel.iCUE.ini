; Ordner, in den iCUE die Sensorprotokolle schreibt
; leer lassen = eigener Dokumente-Ordner
Ordner=
; Nach so vielen Sekunden ohne neuen Eintrag zeigt die Anzeige "--"
MaxAlterSek=180
; Nachkommastellen in der Anzeige (0, 1 oder 2)
Nachkommastellen=1
; Trendpfeil: Vergleich mit dem Wert von vor so vielen Sekunden
TrendSek=60
; Ab dieser Änderung (in °C) zeigt der Pfeil nach oben/unten
TrendSchwelle=0.2
; Zeichen für den Trend (steigt / fällt / steht)
ZeichenSteigt=▲
ZeichenFaellt=▼
ZeichenSteht=►
